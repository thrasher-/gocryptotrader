name: misc
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  lint:
    name: miscellaneous checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Run miscellaneous checks
      run: ./scripts/misc_checks.sh
        

