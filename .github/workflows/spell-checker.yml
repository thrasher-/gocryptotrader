name: codespell
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  codespell:
    name: Spell checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Configuration lives in .codespellrc; this action takes no args input.
      - uses: codespell-project/actions-codespell@v2.4.3
